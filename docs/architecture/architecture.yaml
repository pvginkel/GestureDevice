schemaVersion: "0.1"
producer: gesture-device

# Gesture Device — ESP32-S3 firmware reading a SEN0626 gesture sensor (I2C) and
# an LDR (ADC), publishing detected gestures and illuminance over MQTT.
#
# This repo introduces the FIRMWARE, not the physical device (registered in IoT
# Support, generated as a device: instance there). Universal esp-mdm platform
# edges only. Addresses are NVS-provisioned by IoT Support → no boundBy.

systemSoftware:
  - id: ss:gesture-device,a002a971-868f-4723-80b9-7740349ebcf9
    label: Gesture Device firmware
    summary: >-
      ESP-IDF firmware (ESP32-S3) reading a SEN0626 gesture sensor and an ambient
      light sensor, publishing gesture automations and illuminance over MQTT;
      managed over the air by IoT Support.
    introduced: 2026-02-10
    lifecycle: active
    stereotype: SoftwareProduct
    sourceRepository: git:pvginkel/GestureDevice
    stats:
      mcu: esp32-s3
      sensor: SEN0626

relations:
  - id: rel:gesture-device-consumes-iotsupport
    source: ss:gesture-device,a002a971-868f-4723-80b9-7740349ebcf9
    target: svc:iotsupport-api,b7c5b5ba-36eb-47b8-bf7e-5c50fa1a3656
    type: Association
  - id: rel:gesture-device-consumes-pub-sub
    source: ss:gesture-device,a002a971-868f-4723-80b9-7740349ebcf9
    target: cap:pub-sub-broker
    type: Association
  - id: rel:gesture-device-consumes-iam
    source: ss:gesture-device,a002a971-868f-4723-80b9-7740349ebcf9
    target: cap:iam
    type: Association

  # ── Home Assistant MQTT integration: publishes HA discovery entities
  # (illuminance sensor + gesture automations); topic convention hardcoded → no boundBy. ──
  - id: rel:gesture-device-ha-mqtt
    source: ss:gesture-device,a002a971-868f-4723-80b9-7740349ebcf9
    target: svc:home-assistant-mqtt,23572189-9185-4a6d-a073-2b2820578e11
    type: Association

  # Realizes the IoT-device capability — the selection axis for the IoT view
  # (in-house ESP32 firmware, managed by IoTSupport, integrated via MQTT discovery).
  - id: rel:gesture-device-realizes-iot-device
    source: ss:gesture-device,a002a971-868f-4723-80b9-7740349ebcf9
    target: cap:iot-device
    type: Realization
